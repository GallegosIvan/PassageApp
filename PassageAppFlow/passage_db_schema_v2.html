
<div id="erd" style="padding: 1rem 0;"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryBorderColor: dark ? '#534AB7' : '#AFA9EC',
    secondaryColor: dark ? '#085041' : '#E1F5EE',
    secondaryBorderColor: dark ? '#0F6E56' : '#5DCAA5',
    tertiaryColor: dark ? '#444441' : '#F1EFE8',
    tertiaryBorderColor: dark ? '#5F5E5A' : '#B4B2A9',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  USERS {
    uuid id PK
    string username
    string display_name
    string email
    string avatar_url
    string denomination
    timestamp created_at
  }
  COMMUNITIES {
    uuid id PK
    uuid created_by FK
    string name
    string book
    int chapter
    bool is_private
    timestamp created_at
  }
  COMMUNITY_MEMBERS {
    uuid id PK
    uuid community_id FK
    uuid user_id FK
    string role
    timestamp joined_at
  }
  POSTS {
    uuid id PK
    uuid community_id FK
    uuid user_id FK
    string verse_ref
    text content
    timestamp created_at
  }
  REPLIES {
    uuid id PK
    uuid post_id FK
    uuid user_id FK
    text content
    timestamp created_at
  }
  ANNOTATIONS {
    uuid id PK
    uuid user_id FK
    string book
    int chapter
    int verse_start
    text note
    bool shared
    timestamp created_at
  }
  READING_PLANS {
    uuid id PK
    uuid community_id FK
    string title
    jsonb schedule
    timestamp created_at
  }
  AI_CONVERSATIONS {
    uuid id PK
    uuid user_id FK
    string title
    timestamp created_at
  }
  AI_MESSAGES {
    uuid id PK
    uuid conversation_id FK
    string role
    text content
    string verse_ref
    timestamp created_at
  }
  AI_USAGE {
    uuid id PK
    uuid user_id FK
    int queries_today
    date usage_date
    timestamp updated_at
  }
  SUBSCRIPTIONS {
    uuid id PK
    uuid user_id FK
    string plan
    string status
    timestamp expires_at
  }

  USERS ||--o{ COMMUNITIES : "creates"
  USERS ||--o{ COMMUNITY_MEMBERS : "joins"
  COMMUNITIES ||--o{ COMMUNITY_MEMBERS : "has"
  COMMUNITIES ||--o{ POSTS : "contains"
  USERS ||--o{ POSTS : "writes"
  POSTS ||--o{ REPLIES : "receives"
  USERS ||--o{ REPLIES : "writes"
  USERS ||--o{ ANNOTATIONS : "creates"
  COMMUNITIES ||--o| READING_PLANS : "has"
  USERS ||--o{ AI_CONVERSATIONS : "starts"
  AI_CONVERSATIONS ||--o{ AI_MESSAGES : "contains"
  USERS ||--o| AI_USAGE : "tracked by"
  USERS ||--o| SUBSCRIPTIONS : "has"
`);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
