name: passage
description: A Bible study community app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase - database, auth, realtime
  supabase_flutter: ^2.3.0

  flutter_dotenv: ^5.1.0

  http: ^1.2.0

  # Navigation
  go_router: ^13.0.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3

  # Subscriptions / paywall
  purchases_flutter: 9.16.0

  # Icons
  cupertino_icons: ^1.0.6

  shared_preferences: ^2.2.3

  # QR code generation
  qr_flutter: ^4.1.0

  flutter_markdown: ^0.7.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets: 
      - .env